# The site is markdown; the layout is one file of typography. Deliberately not
# a designed personal website; the case studies are the artifact.
title: Vadim Iushmanov
description: >-
  Platform engineering portfolio: Kubernetes, CI/CD and reliability work, with
  case studies, decision records and a graded skills inventory.
url: https://vvyushmanov.github.io
plugins:
  - jekyll-relative-links      # rewrites in-repo .md links to their built URLs
relative_links:
  enabled: true
  collections: false
exclude:
  - README.md                  # served as index.md; kept for the GitHub repo view
  - Gemfile
  - Gemfile.lock
  - vendor
